# Short commands used locally and in CI:
#   cargo lint        -> strict lint of every crate
#   cargo wasm-check  -> make sure the engine still compiles for the browser
#                        (the server needs real sockets, so it is excluded)
[alias]
lint = "clippy --workspace --all-targets --all-features -- -D warnings"
wasm-check = "check --workspace --exclude lsa-server --target wasm32-unknown-unknown"
