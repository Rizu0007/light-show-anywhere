name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the exact version, components and wasm target.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo lint
      - name: Tesla example show (not stored in the repo)
        run: scripts/fetch-tesla-example.sh
      - name: Test
        run: cargo test --workspace --all-features
        env:
          # Fail instead of skipping tests that play Tesla's example show.
          LSA_REQUIRE_SHOWS: 1
      - name: Browser (wasm) build
        run: cargo wasm-check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build (wasm + typecheck + bundle)
        run: npm run build
      - name: Speaker calibration detector
        run: node scripts/chirp-test.mjs
      - name: Tesla example show (not stored in the repo)
        run: ../scripts/fetch-tesla-example.sh
      - name: Browser tests (party, reconnect, calibration, HTTPS)
        run: scripts/e2e.sh
        env:
          # Preinstalled on GitHub's Ubuntu runners; Ubuntu's AppArmor blocks Chrome's sandbox.
          CHROME: /usr/bin/google-chrome
          CHROME_FLAGS: --no-sandbox
          # No sound card: Chrome's stand-in audio output is far less steady than real hardware.
          CALIBRATE_MAX_ERROR_MS: 20
