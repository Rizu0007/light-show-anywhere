[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/Rizu0007/light-show-anywhere"
publish = false

# One place for every dependency version. Crates opt in with `name.workspace = true`.
[workspace.dependencies]
lsa-fseq = { path = "crates/lsa-fseq" }
lsa-tesla = { path = "crates/lsa-tesla" }

thiserror = { version = "2.0.21", default-features = false }
ruzstd = { version = "0.9.1", default-features = false }
wasm-bindgen = "0.2.129"

# Server
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
# HTTPS for the party server (ring avoids aws-lc's C/CMake build)
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
if-addrs = "0.15.0"
time = { version = "0.3.55", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noisy for binary-format code.
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"

# Fast engine even in debug builds: optimize dependencies, keep our code debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
