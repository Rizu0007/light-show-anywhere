<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="70%" cy="40%" r="80%">
      <stop offset="0" stop-color="#141c2e"/>
      <stop offset="1" stop-color="#070a10"/>
    </radialGradient>
    <radialGradient id="white" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#cfe3ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#cfe3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" r="50%">
      <stop offset="0" stop-color="#fff1c4" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffb020" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamW" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#dbe9ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#dbe9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffc54d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffc54d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18213a"/>
      <stop offset="1" stop-color="#0f1526"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3d6e"/>
      <stop offset="0.33" stop-color="#ffb020"/>
      <stop offset="0.66" stop-color="#3dffa8"/>
      <stop offset="1" stop-color="#5aa0ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- One phone with its light; colour and timing are set where it is used. -->
    <g id="phone">
      <rect x="-9" y="-16" width="18" height="32" rx="4" fill="#0d1220" stroke="#4a5a7c" stroke-width="1.2"/>
      <rect x="-6" y="-12" width="12" height="22" rx="1.5" fill="#1a2440"/>
    </g>
  </defs>

  <rect width="960" height="440" rx="18" fill="url(#bg)"/>
  <text x="36" y="48" fill="#5aa0ff" font-size="13" font-weight="700" letter-spacing="2.5">THE BIG PICTURE</text>
  <text x="36" y="76" fill="#eef3fb" font-size="22" font-weight="700">One laptop, one server, a crowd of phones</text>

  <!-- Host laptop -->
  <g transform="translate(40 140)">
    <rect width="200" height="190" rx="14" fill="url(#card)" stroke="#2b3a5e"/>
    <g transform="translate(55 30)">
      <rect width="90" height="58" rx="5" fill="#0a0f1c" stroke="#5aa0ff" stroke-width="1.5"/>
      <path d="M38 18 L56 29 L38 40 Z" fill="#5aa0ff" filter="url(#glow)"/>
      <path d="M-10 62 H100 L94 70 H-4 Z" fill="#2b3a5e"/>
    </g>
    <text x="100" y="128" fill="#eef3fb" font-size="16" font-weight="700" text-anchor="middle">Host laptop</text>
    <text x="100" y="150" fill="#93a3bf" font-size="12" text-anchor="middle">loads the show + song</text>
    <text x="100" y="168" fill="#93a3bf" font-size="12" text-anchor="middle">shows QR · presses Play</text>
  </g>

  <!-- Host → server -->
  <path d="M240 235 H330" stroke="#5aa0ff" stroke-width="2.5" stroke-dasharray="6 7" fill="none">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <path d="M326 229 L336 235 L326 241 Z" fill="#5aa0ff"/>
  <text x="285" y="222" fill="#93a3bf" font-size="11" text-anchor="middle">show · Play</text>

  <!-- Server -->
  <g transform="translate(340 115)">
    <rect width="230" height="240" rx="14" fill="url(#card)" stroke="#5aa0ff" stroke-opacity="0.6"/>
    <rect width="230" height="240" rx="14" fill="none" stroke="#5aa0ff" stroke-opacity="0.25" stroke-width="6" filter="url(#glow)"/>
    <text x="115" y="40" fill="#eef3fb" font-size="18" font-weight="700" text-anchor="middle">lsa-server</text>
    <text x="115" y="60" fill="#93a3bf" font-size="12" text-anchor="middle">Rust · WebSocket · HTTPS</text>
    <g font-size="12" font-weight="600" text-anchor="middle">
      <rect x="18" y="80" width="92" height="56" rx="9" fill="#0b1222" stroke="#2b3a5e"/>
      <text x="64" y="104" fill="#eef3fb">Rooms</text>
      <text x="64" y="122" fill="#93a3bf" font-weight="400" font-size="10.5">QR code to join</text>
      <rect x="120" y="80" width="92" height="56" rx="9" fill="#0b1222" stroke="#2b3a5e"/>
      <text x="166" y="104" fill="#eef3fb">Clock</text>
      <text x="166" y="122" fill="#93a3bf" font-weight="400" font-size="10.5">one time for all</text>
      <rect x="18" y="146" width="92" height="56" rx="9" fill="#0b1222" stroke="#2b3a5e"/>
      <text x="64" y="170" fill="#eef3fb">Lights</text>
      <text x="64" y="188" fill="#93a3bf" font-weight="400" font-size="10.5">a light per phone</text>
      <rect x="120" y="146" width="92" height="56" rx="9" fill="#0b1222" stroke="#2b3a5e"/>
      <text x="166" y="170" fill="#eef3fb">Safety</text>
      <text x="166" y="188" fill="#93a3bf" font-weight="400" font-size="10.5">no fast strobes</text>
    </g>
    <circle cx="20" cy="222" r="4" fill="#3dffa8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="226" fill="#3dffa8" font-size="11">live · 2000 phones on one laptop</text>
  </g>

  <!-- Server → phones -->
  <g stroke-width="2" fill="none" stroke-dasharray="5 7" opacity="0.85">
    <path d="M570 190 C 620 190, 630 245, 680 262" stroke="#ffb020"/>
    <path d="M570 205 C 625 205, 650 225, 712 240" stroke="#cfe3ff"/>
    <path d="M570 220 C 640 220, 660 280, 740 290" stroke="#cfe3ff"/>
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.7s" repeatCount="indefinite"/>
  </g>
  <text x="628" y="176" fill="#93a3bf" font-size="11" text-anchor="middle">own light track</text>
  <!-- Server → LED strip -->
  <path d="M570 320 C 620 320, 640 380, 690 385" stroke="url(#rgb)" stroke-width="2" fill="none" stroke-dasharray="3 6" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur="0.7s" repeatCount="indefinite"/>
  </path>

  <!-- The crowd, standing in the shape of the car (tape on the ground) -->
  <text x="790" y="128" fill="#93a3bf" font-size="11" text-anchor="middle" letter-spacing="1.5">THE CROWD = THE CAR</text>
  <path d="M722 160 H858 L888 212 L912 226 V318 H668 V226 L692 212 Z" fill="#0b1222" fill-opacity="0.6" stroke="#5aa0ff" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="7 5"/>
  <path d="M732 172 H848 L872 210 H708 Z" fill="none" stroke="#5aa0ff" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Headlights: white -->
  <g>
    <polygon points="704,232 720,232 740,140 684,140" fill="url(#beamW)"/>
    <polygon points="848,232 864,232 884,140 828,140" fill="url(#beamW)"/>
    <circle cx="712" cy="232" r="26" fill="url(#white)"/>
    <circle cx="856" cy="232" r="26" fill="url(#white)"/>
    <animate attributeName="opacity" values="0.12;1;1;0.12;0.12;1;0.12" keyTimes="0;0.06;0.3;0.38;0.6;0.66;1" dur="2.6s" repeatCount="indefinite"/>
  </g>
  <use href="#phone" x="712" y="248"/>
  <use href="#phone" x="856" y="248"/>

  <!-- Turn signals: amber -->
  <g>
    <polygon points="672,258 688,258 700,190 660,190" fill="url(#beamA)"/>
    <polygon points="880,258 896,258 908,190 868,190" fill="url(#beamA)"/>
    <circle cx="680" cy="258" r="22" fill="url(#amber)"/>
    <circle cx="888" cy="258" r="22" fill="url(#amber)"/>
    <animate attributeName="opacity" values="0.08;0.08;1;0.08;1;0.08;0.08" keyTimes="0;0.38;0.42;0.5;0.54;0.62;1" dur="2.6s" repeatCount="indefinite"/>
  </g>
  <use href="#phone" x="680" y="274"/>
  <use href="#phone" x="888" y="274"/>

  <!-- Fog lights: white -->
  <g>
    <polygon points="736,282 752,282 766,210 722,210" fill="url(#beamW)"/>
    <polygon points="816,282 832,282 846,210 802,210" fill="url(#beamW)"/>
    <circle cx="744" cy="282" r="22" fill="url(#white)"/>
    <circle cx="824" cy="282" r="22" fill="url(#white)"/>
    <animate attributeName="opacity" values="0.1;0.1;1;1;0.1" keyTimes="0;0.14;0.2;0.55;1" dur="2.6s" repeatCount="indefinite"/>
  </g>
  <use href="#phone" x="744" y="298"/>
  <use href="#phone" x="824" y="298"/>

  <!-- WLED strip -->
  <g transform="translate(696 372)">
    <rect width="216" height="26" rx="13" fill="#0b1222" stroke="#2b3a5e"/>
    <g filter="url(#glow)">
      <rect x="12" y="10" width="192" height="6" rx="3" fill="url(#rgb)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <text x="804" y="418" fill="#93a3bf" font-size="11" text-anchor="middle">+ WLED LED strips (optional)</text>
</svg>
