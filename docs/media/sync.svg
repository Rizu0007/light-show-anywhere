<rect width="960" height="400" rx="18" fill="url(#bg)"/>
<text x="36" y="48" fill="#5aa0ff" font-size="13" font-weight="700" letter-spacing="2.5">HOW EVERY PHONE FLASHES AT ONCE</text>
<text x="36" y="76" fill="#eef3fb" font-size="22" font-weight="700">One shared clock, one start time</text>
<rect x="150" y="98" width="400" height="246" rx="10" fill="#5aa0ff" fill-opacity="0.04"/>
<text x="355.0" y="366" fill="#93a3bf" font-size="12" text-anchor="middle">① Phones ask the server the time every 2 s and keep the fastest answer</text>
<text x="750.0" y="366" fill="#93a3bf" font-size="12" text-anchor="middle">② Play → start at T, 1 s later</text>
<text x="537.0" y="388" fill="#7f8fae" font-size="11" text-anchor="middle">Each phone knows how far its clock is from the server, so "T on the server" is the same moment everywhere.</text>
<text x="36" y="126" fill="#eef3fb" font-size="13.5" font-weight="700">Server</text>
